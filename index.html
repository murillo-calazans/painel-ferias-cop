<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal COP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        /* ===== RESET E VARIÁVEIS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-body: #eef2f7;
            --bg-card: rgba(255, 255, 255, 0.7);
            --bg-glass: rgba(255, 255, 255, 0.5);
            --border-glass: rgba(255, 255, 255, 0.3);
            --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.15);

            --accent: #4f8cf7;
            --accent-light: #dbeafe;
            --accent-dark: #3a6bd5;

            --text-primary: #1a2332;
            --text-secondary: #4a5b6e;
            --text-muted: #8a9aa8;

            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        header {
            background: linear-gradient(135deg, #4f8cf7, #6c5ce7);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .logo span {
            font-weight: 300;
            opacity: 0.8;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
        }
        .header-sub {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .header-date {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.15);
            padding: 0.4rem 1rem;
            border-radius: 30px;
            backdrop-filter: blur(4px);
        }

        /* ===== LAYOUT ===== */
        .app-layout {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 220px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            padding: 1.5rem 0;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            overflow-y: auto;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.8rem 1.5rem;
            color: var(--text-secondary);
            background: transparent;
            border: none;
            border-left: 3px solid transparent;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
            width: 100%;
            white-space: nowrap;
        }
        .sidebar-item:hover {
            color: var(--text-primary);
            background: rgba(79, 140, 247, 0.08);
        }
        .sidebar-item.active {
            color: var(--accent);
            background: rgba(79, 140, 247, 0.12);
            border-left-color: var(--accent);
            font-weight: 600;
        }
        .sidebar-item .icon {
            font-size: 1.3rem;
            width: 28px;
            text-align: center;
            flex-shrink: 0;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            padding: 2rem 2.5rem;
            overflow-y: auto;
            background: var(--bg-body);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== CARDS GLASSMORPHISM ===== */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }

        .card {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow-glass);
            transition: var(--transition);
            min-height: 130px;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            background: rgba(255, 255, 255, 0.8);
        }

        .card-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .card-title i {
            font-size: 1rem;
        }

        .card-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .card-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .card-list li {
            padding: 4px 0;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-list li:last-child {
            border-bottom: none;
        }
        .card-list .badge {
            background: var(--accent-light);
            color: var(--accent);
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .weekend-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 8px;
        }
        .weekend-col {
            background: rgba(255, 255, 255, 0.5);
            border-radius: var(--radius-sm);
            padding: 12px;
        }
        .weekend-col h4 {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .weekend-col .plantao-mini {
            font-size: 0.85rem;
            padding: 4px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }
        .weekend-col .plantao-mini:last-child {
            border-bottom: none;
        }
        .weekend-col .plantao-mini strong {
            font-weight: 600;
        }

        .highlight-month {
            background: linear-gradient(135deg, #fef9e7, #fdebd0);
            border-left: 4px solid #f39c12;
        }

        /* ===== EQUIPE (sem plantões) ===== */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .team-card {
            background: var(--bg-glass);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            padding: 1.5rem;
            box-shadow: var(--shadow-glass);
            transition: var(--transition);
        }
        .team-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-3px);
        }

        .team-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }
        .team-horario {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .team-horario i {
            margin-right: 6px;
            color: var(--accent);
        }

        /* ===== PLANTÃO ===== */
        .plantao-month-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .plantao-month-title .nav-buttons {
            display: flex;
            gap: 0.5rem;
        }
        .plantao-month-title .nav-buttons button {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 30px;
            padding: 0.3rem 1rem;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
        }
        .plantao-month-title .nav-buttons button:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .plantao-weekend-group {
            margin-bottom: 2rem;
        }
        .plantao-weekend-group h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border-glass);
        }

        .plantao-weekend-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .plantao-day-block {
            background: var(--bg-glass);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            padding: 1rem 1.2rem;
            box-shadow: var(--shadow-glass);
        }
        .plantao-day-block h4 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        .plantao-day-block .day-date {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
        .plantao-day-block ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .plantao-day-block ul li {
            padding: 4px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }
        .plantao-day-block ul li:last-child {
            border-bottom: none;
        }
        .plantao-day-block .no-data {
            padding: 0.5rem 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* ===== FÉRIAS ===== */
        .ferias-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .feria-card {
            background: var(--bg-glass);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            padding: 1.5rem;
            box-shadow: var(--shadow-glass);
            border-left: 5px solid var(--accent);
            transition: var(--transition);
        }
        .feria-card:hover {
            box-shadow: var(--shadow-hover);
        }
        .feria-nome {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
        }
        .feria-periodo {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }
        .feria-status {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 0.75rem;
        }
        .feria-status.ativa {
            background: #d4edda;
            color: #155724;
        }
        .feria-status.futura {
            background: #cce5ff;
            color: #004085;
        }
        .feria-status.passada {
            background: #f8d7da;
            color: #721c24;
        }

        /* ===== ANIVERSARIANTES ===== */
        .aniversarios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }
        .aniversario-card {
            background: var(--bg-glass);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            padding: 1.5rem;
            text-align: center;
            box-shadow: var(--shadow-glass);
            transition: var(--transition);
            position: relative;
        }
        .aniversario-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-3px);
        }
        .aniversario-card.destaque {
            background: linear-gradient(135deg, #fef9e7, #fdebd0);
            border: 2px solid #f39c12;
        }
        .aniversario-emoji {
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
        }
        .aniversario-nome {
            font-weight: 700;
            color: var(--text-primary);
        }
        .aniversario-data {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }
        .aniversario-contador {
            font-size: 0.8rem;
            color: var(--accent);
            margin-top: 0.5rem;
            font-weight: 500;
        }

        /* ===== SKELETON ===== */
        .skeleton {
            background: linear-gradient(90deg, #e9edf4 25%, #f4f7fc 50%, #e9edf4 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
            height: 2rem;
            width: 80%;
            margin: 0.5rem 0;
        }
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        .no-data {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .error-box {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 1.5rem;
            border-radius: var(--radius-sm);
            text-align: center;
        }
        .retry-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: 0.2s;
        }
        .retry-btn:hover {
            background: var(--accent-dark);
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 1200px) {
            .dashboard-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .weekend-grid {
                grid-template-columns: 1fr;
            }
            .plantao-weekend-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                flex-direction: row;
                overflow-x: auto;
                padding: 0.5rem;
                border-right: none;
                border-bottom: 1px solid var(--border-glass);
                gap: 0;
            }
            .sidebar-item {
                padding: 0.6rem 1rem;
                border-left: none;
                border-bottom: 3px solid transparent;
                white-space: nowrap;
                font-size: 0.85rem;
                flex-shrink: 0;
            }
            .sidebar-item.active {
                border-left-color: transparent;
                border-bottom-color: var(--accent);
                background: transparent;
            }
            .app-layout {
                flex-direction: column;
            }
            .main-content {
                padding: 1rem;
            }
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .team-grid,
            .ferias-grid,
            .aniversarios-grid {
                grid-template-columns: 1fr;
            }
            header {
                flex-direction: column;
                align-items: stretch;
                padding: 16px;
            }
            .header-left {
                justify-content: center;
            }
            .header-right {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .sidebar-item {
                font-size: 0.75rem;
                padding: 0.4rem 0.6rem;
            }
            .sidebar-item .icon {
                font-size: 1rem;
                width: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="header-left">
            <div class="logo">📊 <span>COP</span></div>
            <div>
                <div class="header-title">Portal COP</div>
                <div class="header-sub">Central de Operações e Planejamento</div>
            </div>
        </div>
        <div class="header-right">
            <div class="header-date" id="currentDate"></div>
        </div>
    </header>

    <!-- ===== LAYOUT ===== -->
    <div class="app-layout">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <button class="sidebar-item active" data-tab="dashboard"><span class="icon"><i class="fas fa-chart-pie"></i></span> Dashboard</button>
            <button class="sidebar-item" data-tab="equipe"><span class="icon"><i class="fas fa-users"></i></span> Equipe</button>
            <button class="sidebar-item" data-tab="plantoes"><span class="icon"><i class="fas fa-calendar-day"></i></span> Plantões</button>
            <button class="sidebar-item" data-tab="ferias"><span class="icon"><i class="fas fa-umbrella-beach"></i></span> Férias</button>
            <button class="sidebar-item" data-tab="aniversarios"><span class="icon"><i class="fas fa-birthday-cake"></i></span> Aniversariantes</button>
        </nav>

        <!-- Conteúdo -->
        <main class="main-content">

            <!-- ===== DASHBOARD ===== -->
            <div class="tab-content active" id="dashboard">
                <div class="dashboard-grid" id="dashboardGrid">
                    <!-- Preenchido via JS -->
                </div>
            </div>

            <!-- ===== EQUIPE ===== -->
            <div class="tab-content" id="equipe">
                <div class="team-grid" id="teamGrid"></div>
            </div>

            <!-- ===== PLANTÕES ===== -->
            <div class="tab-content" id="plantoes">
                <div class="plantao-month-title" id="plantaoMonthTitle">
                    <!-- Mês e botões de navegação -->
                </div>
                <div id="plantaoContainer">
                    <!-- Grupos de fim de semana -->
                </div>
            </div>

            <!-- ===== FÉRIAS ===== -->
            <div class="tab-content" id="ferias">
                <div class="ferias-grid" id="feriasGrid"></div>
            </div>

            <!-- ===== ANIVERSARIANTES ===== -->
            <div class="tab-content" id="aniversarios">
                <div class="aniversarios-grid" id="aniversariosGrid"></div>
            </div>

        </main>
    </div>

    <script>
        // ============================================================
        //  CONFIGURAÇÕES
        // ============================================================
        const API_URL = 'https://murjjo.app.n8n.cloud/webhook/c04924e1-9964-447a-a72a-f943f5edfe31';
        const CACHE_KEY = 'portalCopData';
        const CACHE_TTL = 5 * 60 * 1000;
        const FETCH_TIMEOUT = 30000;

        let dados = null;
        let currentDate = new Date(); // usado para navegação de meses na aba Plantões
        let loading = false;

        // ============================================================
        //  UTILITÁRIOS
        // ============================================================
        function log(msg, data) {
            console.log(`[PortalCOP] ${msg}`, data || '');
        }

        function formatarData(data) {
            return new Date(data).toLocaleDateString('pt-BR', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function formatarDataCurta(data) {
            return new Date(data).toLocaleDateString('pt-BR');
        }

        function excelDateToJSDate(excelDate) {
            if (!excelDate) return null;
            const utc = new Date((excelDate - 25569) * 86400 * 1000);
            return new Date(utc.getUTCFullYear(), utc.getUTCMonth(), utc.getUTCDate());
        }

        // ============================================================
        //  CACHE
        // ============================================================
        function salvarCache(dados) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), data: dados }));
            } catch (e) {}
        }

        function carregarCache() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                if (!raw) return null;
                const payload = JSON.parse(raw);
                return payload.data;
            } catch (e) {
                return null;
            }
        }

        // ============================================================
        //  BUSCA DE DADOS
        // ============================================================
        async function buscarDadosRemotos() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT);
            try {
                const response = await fetch(API_URL, { signal: controller.signal });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (err) {
                clearTimeout(timeoutId);
                if (err.name === 'AbortError') throw new Error('Tempo limite excedido (30s)');
                throw err;
            }
        }

        // ============================================================
        //  CARREGAR DADOS
        // ============================================================
        async function carregarDados(forceRefresh = false) {
            if (loading) return;
            loading = true;
            mostrarSkeleton();

            try {
                if (!forceRefresh) {
                    const cache = carregarCache();
                    if (cache) {
                        dados = cache;
                        loading = false;
                        atualizarUI();
                        // atualiza em segundo plano
                        buscarDadosRemotos()
                            .then(novos => {
                                dados = novos;
                                salvarCache(novos);
                                atualizarUI();
                            })
                            .catch(() => {});
                        return;
                    }
                }

                const novosDados = await buscarDadosRemotos();
                dados = novosDados;
                salvarCache(novosDados);
                atualizarUI();
            } catch (err) {
                const cache = carregarCache();
                if (cache) {
                    dados = cache;
                    atualizarUI();
                    const grid = document.getElementById('dashboardGrid');
                    const msg = document.createElement('div');
                    msg.className = 'error-box';
                    msg.style.gridColumn = '1 / -1';
                    msg.style.marginTop = '1rem';
                    msg.innerHTML = `
                        <p>⚠️ ${err.message}. Exibindo dados em cache.</p>
                        <button class="retry-btn" onclick="carregarDados(true)">🔄 Tentar novamente</button>
                    `;
                    grid.appendChild(msg);
                } else {
                    mostrarErro(err.message);
                }
            } finally {
                loading = false;
            }
        }

        // ============================================================
        //  SKELETON E ERRO
        // ============================================================
        function mostrarSkeleton() {
            const grid = document.getElementById('dashboardGrid');
            grid.innerHTML = `
                <div class="card"><div class="card-title"><i class="fas fa-users"></i> Colaboradores</div><div class="skeleton"></div></div>
                <div class="card" style="grid-column: span 2;"><div class="card-title"><i class="fas fa-calendar-week"></i> Próximo Fim de Semana</div><div class="skeleton" style="height:4rem;"></div><div class="skeleton"></div></div>
                <div class="card"><div class="card-title"><i class="fas fa-calendar-alt"></i> Plantões este mês</div><div class="skeleton"></div></div>
                <div class="card"><div class="card-title"><i class="fas fa-umbrella-beach"></i> Em Férias</div><div class="skeleton"></div></div>
                <div class="card"><div class="card-title"><i class="fas fa-birthday-cake"></i> Aniversariantes</div><div class="skeleton"></div></div>
                <div class="card"><div class="card-title"><i class="fas fa-clock"></i> Folgas</div><div class="skeleton"></div></div>
            `;
            document.getElementById('teamGrid').innerHTML = '';
            document.getElementById('feriasGrid').innerHTML = '';
            document.getElementById('aniversariosGrid').innerHTML = '';
            document.getElementById('plantaoContainer').innerHTML = '';
            document.getElementById('plantaoMonthTitle').innerHTML = '';
        }

        function mostrarErro(mensagem) {
            const grid = document.getElementById('dashboardGrid');
            grid.innerHTML = `
                <div class="error-box" style="grid-column:1/-1;padding:2rem;">
                    <p>❌ ${mensagem}</p>
                    <button class="retry-btn" onclick="carregarDados(true)">🔄 Tentar novamente</button>
                </div>
            `;
        }

        // ============================================================
        //  ATUALIZAR UI
        // ============================================================
        function atualizarUI() {
            if (!dados) return;
            const todosColab = dados.colaboradores || [];
            const todosPlant = dados.plantoes || [];
            const todasFerias = dados.ferias || [];
            const todosAniv = dados.aniversarios || [];

            document.getElementById('currentDate').textContent = formatarData(new Date());

            atualizarDashboard(todosColab, todosPlant, todasFerias, todosAniv);
            atualizarEquipe(todosColab);
            atualizarPlantao(todosPlant);
            atualizarFerias(todasFerias);
            atualizarAniversarios(todosAniv);
        }

        // ============================================================
        //  DASHBOARD
        // ============================================================
        function atualizarDashboard(todosColab, todosPlant, todasFerias, todosAniv) {
            const hoje = new Date();
            const mes = hoje.getMonth();
            const ano = hoje.getFullYear();

            // Total colaboradores
            const cardTotal = document.querySelector('#dashboardGrid .card:first-child');
            if (cardTotal) {
                cardTotal.innerHTML = `
                    <div class="card-title"><i class="fas fa-users"></i> Colaboradores</div>
                    <div class="card-value">${todosColab.length}</div>
                `;
            }

            // Plantões este mês (lista de datas)
            const plantMes = todosPlant
                .filter(p => {
                    const d = excelDateToJSDate(p.Data);
                    return d && d.getMonth() === mes && d.getFullYear() === ano;
                })
                .sort((a, b) => excelDateToJSDate(a.Data) - excelDateToJSDate(b.Data));

            const cardPlantMes = document.querySelector('#dashboardGrid .card:nth-child(3)');
            if (cardPlantMes) {
                let html = `<div class="card-title"><i class="fas fa-calendar-alt"></i> Plantões este mês</div>`;
                if (plantMes.length === 0) {
                    html += `<div class="no-data">Nenhum plantão no mês</div>`;
                } else {
                    html += `<ul class="card-list">`;
                    const datasUnicas = [...new Set(plantMes.map(p => formatarDataCurta(excelDateToJSDate(p.Data))))];
                    datasUnicas.forEach(d => {
                        html += `<li>${d}</li>`;
                    });
                    html += `</ul>`;
                }
                cardPlantMes.innerHTML = html;
            }

            // Férias (apenas as que ainda não terminaram e intersectam o mês)
            const feriasMes = todasFerias.filter(f => {
                const ini = excelDateToJSDate(f.Início);
                const fim = excelDateToJSDate(f.Fim);
                if (!ini || !fim) return false;
                const primeiroDiaMes = new Date(ano, mes, 1);
                const ultimoDiaMes = new Date(ano, mes + 1, 0);
                const intersecta = (ini <= ultimoDiaMes && fim >= primeiroDiaMes);
                return intersecta && fim >= hoje;
            });

            const cardFerias = document.querySelector('#dashboardGrid .card:nth-child(4)');
            if (cardFerias) {
                let html = `<div class="card-title"><i class="fas fa-umbrella-beach"></i> Em Férias</div>`;
                if (feriasMes.length === 0) {
                    html += `<div class="no-data">Nenhum colaborador em férias neste mês</div>`;
                } else {
                    html += `<ul class="card-list">`;
                    feriasMes.forEach(f => {
                        html += `<li>${f.Nome}</li>`;
                    });
                    html += `</ul>`;
                }
                cardFerias.innerHTML = html;
            }

            // Aniversariantes
            const anivMes = todosAniv
                .filter(a => {
                    const d = excelDateToJSDate(a.Data);
                    return d && d.getMonth() === mes;
                });

            const cardAniv = document.querySelector('#dashboardGrid .card:nth-child(5)');
            if (cardAniv) {
                let html = `<div class="card-title"><i class="fas fa-birthday-cake"></i> Aniversariantes</div>`;
                if (anivMes.length === 0) {
                    html += `<div class="no-data">Nenhum aniversário este mês</div>`;
                } else {
                    html += `<ul class="card-list">`;
                    anivMes.forEach(a => {
                        const data = excelDateToJSDate(a.Data);
                        const dias = Math.ceil((new Date(ano, mes, data.getDate()) - hoje) / (1000 * 60 * 60 * 24));
                        const texto = dias >= 0 ? `em ${dias} dias` : 'passou';
                        html += `<li><span>🎉 ${a.Nome}</span> <span class="badge">${texto}</span></li>`;
                    });
                    html += `</ul>`;
                }
                cardAniv.innerHTML = html;
                if (anivMes.length > 0) cardAniv.classList.add('highlight-month');
                else cardAniv.classList.remove('highlight-month');
            }

            // Próximo Fim de Semana
            const plantFuturos = todosPlant
                .filter(p => excelDateToJSDate(p.Data) >= hoje)
                .sort((a, b) => excelDateToJSDate(a.Data) - excelDateToJSDate(b.Data));

            const cardWeekend = document.querySelector('#dashboardGrid .card:nth-child(2)');
            if (cardWeekend) {
                let sabado = null,
                    domingo = null;
                for (let p of plantFuturos) {
                    const d = excelDateToJSDate(p.Data);
                    if (!d) continue;
                    const dia = d.getDay();
                    if (dia === 6 && !sabado) sabado = d;
                    if (dia === 0 && !domingo) domingo = d;
                    if (sabado && domingo) break;
                }

                let html = `<div class="card-title"><i class="fas fa-calendar-week"></i> Próximo Fim de Semana</div>`;
                html += `<div class="weekend-grid">`;
                // Sábado
                html += `<div class="weekend-col"><h4><i class="fas fa-calendar-day"></i> Sábado</h4>`;
                if (sabado) {
                    const plantSab = plantFuturos.filter(p => {
                        const d = excelDateToJSDate(p.Data);
                        return d && d.toDateString() === sabado.toDateString();
                    });
                    html += `<div style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:6px;">${formatarDataCurta(sabado)}</div>`;
                    plantSab.forEach(p => {
                        html += `<div class="plantao-mini"><strong>${p.Colaborador}</strong> - ${p.Horário || '08:00 às 17:00'}</div>`;
                    });
                } else {
                    html += `<div class="no-data">Sem plantão no sábado</div>`;
                }
                html += `</div>`;
                // Domingo
                html += `<div class="weekend-col"><h4><i class="fas fa-calendar-day"></i> Domingo</h4>`;
                if (domingo) {
                    const plantDom = plantFuturos.filter(p => {
                        const d = excelDateToJSDate(p.Data);
                        return d && d.toDateString() === domingo.toDateString();
                    });
                    html += `<div style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:6px;">${formatarDataCurta(domingo)}</div>`;
                    plantDom.forEach(p => {
                        html += `<div class="plantao-mini"><strong>${p.Colaborador}</strong> - ${p.Horário || '08:00 às 17:00'}</div>`;
                    });
                } else {
                    html += `<div class="no-data">Sem plantão no domingo</div>`;
                }
                html += `</div>`;
                html += `</div>`;
                cardWeekend.innerHTML = html;
            }

            // Folgas
            const cardFolga = document.querySelector('#dashboardGrid .card:nth-child(6)');
            if (cardFolga) {
                cardFolga.innerHTML = `
                    <div class="card-title"><i class="fas fa-clock"></i> Folgas</div>
                    <div class="no-data">Nenhuma folga registrada para este mês</div>
                    <div style="font-size:0.8rem;color:var(--text-muted);margin-top:8px;">💡 Cadastre as folgas para visualização aqui.</div>
                `;
            }
        }

        // ============================================================
        //  EQUIPE (somente horário)
        // ============================================================
        function atualizarEquipe(colaboradores) {
            const grid = document.getElementById('teamGrid');
            grid.innerHTML = '';
            if (!colaboradores || colaboradores.length === 0) {
                grid.innerHTML = '<div class="no-data">Nenhum colaborador</div>';
                return;
            }

            const sorted = [...colaboradores].sort((a, b) => a.Nome.localeCompare(b.Nome));

            sorted.forEach(colab => {
                const card = document.createElement('div');
                card.className = 'team-card';

                let horario = colab.Horário || 'Não informado';
                let horarioDisplay = horario;
                if (!horario.includes('Seg')) {
                    horarioDisplay = `Seg a Sex: ${horario}`;
                }

                card.innerHTML = `
                    <div class="team-name">${colab.Nome}</div>
                    <div class="team-horario"><i class="fas fa-clock"></i> ${horarioDisplay}</div>
                `;
                grid.appendChild(card);
            });
        }

        // ============================================================
        //  PLANTÃO (agrupamento correto considerando sábados que podem estar no mês anterior)
        // ============================================================
        function atualizarPlantao(todosPlantoes) {
            const monthTitle = document.getElementById('plantaoMonthTitle');
            const monthName = currentDate.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
            monthTitle.innerHTML = `
                ${monthName}
                <span class="nav-buttons">
                    <button id="prevMonthPlantao"><i class="fas fa-chevron-left"></i></button>
                    <button id="nextMonthPlantao"><i class="fas fa-chevron-right"></i></button>
                </span>
            `;

            document.getElementById('prevMonthPlantao').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                if (dados) atualizarPlantao(dados.plantoes);
            });
            document.getElementById('nextMonthPlantao').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                if (dados) atualizarPlantao(dados.plantoes);
            });

            const container = document.getElementById('plantaoContainer');
            container.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Filtrar plantões do mês selecionado
            const plantMes = todosPlantoes.filter(p => {
                const d = excelDateToJSDate(p.Data);
                if (!d) return false;
                return d.getMonth() === month && d.getFullYear() === year;
            });

            // Ordenar por data
            plantMes.sort((a, b) => excelDateToJSDate(a.Data) - excelDateToJSDate(b.Data));

            // Encontrar todos os sábados que podem estar no mês anterior ou no atual
            // Vamos gerar uma lista de sábados que cobrem o período do mês (incluindo possível sábado anterior)
            const primeiroDiaMes = new Date(year, month, 1);
            const ultimoDiaMes = new Date(year, month + 1, 0);

            // Sábado mais próximo antes ou no primeiro dia do mês
            let sabadoInicio = new Date(primeiroDiaMes);
            while (sabadoInicio.getDay() !== 6) {
                sabadoInicio.setDate(sabadoInicio.getDate() - 1);
            }
            // Se o sábado encontrado for muito antes (mais de 6 dias), ajustamos para o próximo sábado
            // Mas precisamos de todos os sábados que tenham interseção com o mês (sábado ou domingo dentro do mês)
            // Vamos gerar sábados a partir de sabadoInicio até depois do último dia do mês
            const sábados = [];
            let current = new Date(sabadoInicio);
            while (current <= ultimoDiaMes || (current.getDay() === 6 && current <= ultimoDiaMes)) {
                // Só adiciona se o sábado ou o domingo seguinte estiver no mês
                const domingo = new Date(current);
                domingo.setDate(domingo.getDate() + 1);
                const temIntersecao = (current >= primeiroDiaMes && current <= ultimoDiaMes) ||
                                      (domingo >= primeiroDiaMes && domingo <= ultimoDiaMes);
                if (temIntersecao) {
                    sábados.push(new Date(current));
                }
                current.setDate(current.getDate() + 7);
            }

            let weekendIndex = 1;
            sábados.forEach(sabado => {
                const domingo = new Date(sabado);
                domingo.setDate(domingo.getDate() + 1);

                // Coletar plantões do sábado e domingo que estejam no mês (mas podem ser de meses diferentes)
                const plantSab = plantMes.filter(p => {
                    const d = excelDateToJSDate(p.Data);
                    return d && d.toDateString() === sabado.toDateString();
                });
                const plantDom = plantMes.filter(p => {
                    const d = excelDateToJSDate(p.Data);
                    return d && d.toDateString() === domingo.toDateString();
                });

                // Só exibe o grupo se houver pelo menos um plantão em um dos dois dias
                if (plantSab.length === 0 && plantDom.length === 0) return;

                // Verifica se o sábado e domingo pertencem ao mês para exibir a data correta
                const sabadoNoMes = (sabado >= primeiroDiaMes && sabado <= ultimoDiaMes);
                const domingoNoMes = (domingo >= primeiroDiaMes && domingo <= ultimoDiaMes);

                const groupDiv = document.createElement('div');
                groupDiv.className = 'plantao-weekend-group';

                const titulo = document.createElement('h3');
                titulo.textContent = `Fim de semana ${weekendIndex}`;
                groupDiv.appendChild(titulo);

                const row = document.createElement('div');
                row.className = 'plantao-weekend-row';

                // Bloco Sábado
                const sabadoBlock = document.createElement('div');
                sabadoBlock.className = 'plantao-day-block';
                sabadoBlock.innerHTML = `
                    <h4><i class="fas fa-calendar-day" style="color:var(--accent);margin-right:6px;"></i> Sábado</h4>
                    <div class="day-date">${sabadoNoMes ? formatarDataCurta(sabado) : '—'}</div>
                    <ul>
                        ${!sabadoNoMes ? '<li class="no-data">Fora do mês</li>' :
                        plantSab.length === 0 ? '<li class="no-data">Sem plantão</li>' :
                        plantSab.map(p => `<li><span>${p.Colaborador}</span> <span>${p.Horário || '08:00 às 17:00'}</span></li>`).join('')}
                    </ul>
                `;

                // Bloco Domingo
                const domingoBlock = document.createElement('div');
                domingoBlock.className = 'plantao-day-block';
                domingoBlock.innerHTML = `
                    <h4><i class="fas fa-calendar-day" style="color:var(--accent);margin-right:6px;"></i> Domingo</h4>
                    <div class="day-date">${domingoNoMes ? formatarDataCurta(domingo) : '—'}</div>
                    <ul>
                        ${!domingoNoMes ? '<li class="no-data">Fora do mês</li>' :
                        plantDom.length === 0 ? '<li class="no-data">Sem plantão</li>' :
                        plantDom.map(p => `<li><span>${p.Colaborador}</span> <span>${p.Horário || '08:00 às 17:00'}</span></li>`).join('')}
                    </ul>
                `;

                row.appendChild(sabadoBlock);
                row.appendChild(domingoBlock);
                groupDiv.appendChild(row);
                container.appendChild(groupDiv);
                weekendIndex++;
            });

            if (container.children.length === 0) {
                container.innerHTML = `<div class="no-data">Nenhum plantão em fins de semana neste mês</div>`;
            }
        }

        // ============================================================
        //  FÉRIAS
        // ============================================================
        function atualizarFerias(ferias) {
            const grid = document.getElementById('feriasGrid');
            grid.innerHTML = '';
            if (!ferias || ferias.length === 0) {
                grid.innerHTML = '<div class="no-data">Nenhuma féria registrada</div>';
                return;
            }
            const hoje = new Date();
            ferias.sort((a, b) => a.Início - b.Início);
            ferias.forEach(f => {
                const inicio = excelDateToJSDate(f.Início);
                const fim = excelDateToJSDate(f.Fim);
                if (!inicio || !fim) return;
                let status = 'futura',
                    statusText = 'Futura';
                if (inicio <= hoje && hoje <= fim) { status = 'ativa';
                    statusText = 'Em andamento'; } else if (fim < hoje) { status = 'passada';
                    statusText = 'Finalizada'; }
                const card = document.createElement('div');
                card.className = 'feria-card';
                card.innerHTML = `
                    <div class="feria-nome">${f.Nome}</div>
                    <div class="feria-periodo">${formatarDataCurta(inicio)} — ${formatarDataCurta(fim)}</div>
                    <span class="feria-status ${status}">${statusText}</span>
                `;
                grid.appendChild(card);
            });
        }

        // ============================================================
        //  ANIVERSARIANTES
        // ============================================================
        function atualizarAniversarios(aniversarios) {
            const grid = document.getElementById('aniversariosGrid');
            grid.innerHTML = '';
            if (!aniversarios || aniversarios.length === 0) {
                grid.innerHTML = '<div class="no-data">Nenhum aniversário registrado</div>';
                return;
            }

            const hoje = new Date();
            const mesAtual = hoje.getMonth();
            const anoAtual = hoje.getFullYear();

            aniversarios.sort((a, b) => {
                const da = excelDateToJSDate(a.Data);
                const db = excelDateToJSDate(b.Data);
                if (!da || !db) return 0;
                return da.getMonth() - db.getMonth() || da.getDate() - db.getDate();
            });

            aniversarios.forEach(a => {
                const data = excelDateToJSDate(a.Data);
                if (!data) return;
                const isThisMonth = data.getMonth() === mesAtual;
                let diasRestantes = 0;
                if (isThisMonth) {
                    const hojeSemAno = new Date(anoAtual, mesAtual, hoje.getDate());
                    const anivEsteAno = new Date(anoAtual, data.getMonth(), data.getDate());
                    if (anivEsteAno < hojeSemAno) {
                        const proxAniv = new Date(anoAtual + 1, data.getMonth(), data.getDate());
                        diasRestantes = Math.ceil((proxAniv - hoje) / (1000 * 60 * 60 * 24));
                    } else {
                        diasRestantes = Math.ceil((anivEsteAno - hoje) / (1000 * 60 * 60 * 24));
                    }
                }

                const card = document.createElement('div');
                card.className = 'aniversario-card';
                if (isThisMonth) {
                    card.classList.add('destaque');
                }

                let contadorHtml = '';
                if (isThisMonth) {
                    if (diasRestantes === 0) contadorHtml = '<div class="aniversario-contador">🎉 Hoje é o dia!</div>';
                    else if (diasRestantes > 0) contadorHtml =
                        `<div class="aniversario-contador">⏳ ${diasRestantes} dias</div>`;
                    else contadorHtml = '<div class="aniversario-contador">✅ Já passou</div>';
                } else {
                    const proxAniv = new Date(anoAtual, data.getMonth(), data.getDate());
                    if (proxAniv < hoje) proxAniv.setFullYear(anoAtual + 1);
                    const dias = Math.ceil((proxAniv - hoje) / (1000 * 60 * 60 * 24));
                    contadorHtml = `<div class="aniversario-contador">📅 em ${dias} dias</div>`;
                }

                card.innerHTML = `
                    <div class="aniversario-emoji">🎂</div>
                    <div class="aniversario-nome">${a.Nome}</div>
                    <div class="aniversario-data">${data.toLocaleDateString('pt-BR', { month: 'long', day: 'numeric' })}</div>
                    ${contadorHtml}
                `;
                grid.appendChild(card);
            });
        }

        // ============================================================
        //  EVENTOS
        // ============================================================
        document.querySelectorAll('.sidebar-item').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(tab).classList.add('active');
            });
        });

        // ============================================================
        //  INICIALIZAÇÃO
        // ============================================================
        log('Inicializando Portal COP...');
        carregarDados();

        setInterval(() => {
            if (dados) {
                buscarDadosRemotos()
                    .then(novos => {
                        dados = novos;
                        salvarCache(novos);
                        atualizarUI();
                    })
                    .catch(() => {});
            }
        }, 5 * 60 * 1000);
    </script>
</body>
</html>
